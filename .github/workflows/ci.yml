name: Release validation

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: make verify-static PYTHON=python

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: make verify-local PYTHON=python
      - name: Runtime diagnostics
        if: failure()
        run: docker compose -f infra/docker-compose.dev.yml logs --no-color --tail=100
      - name: Stop validation stack
        if: always()
        run: docker compose -f infra/docker-compose.dev.yml down
